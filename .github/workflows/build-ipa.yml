      - name: 编译 (不签名)
        run: |
          xcodebuild -project SubstationApp.xcodeproj \
            -scheme SubstationApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/SubstationApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
      - name: 打包为未签名 IPA
        run: |
          APP="$PWD/build/SubstationApp.xcarchive/Products/Applications/SubstationApp.app"
          if [ ! -d "$APP" ]; then echo "编译产物缺失"; find build -maxdepth 5; exit 1; fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry SubstationApp_未签名.ipa Payload
          ls -lh SubstationApp_未签名.ipa
      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: SubstationApp_未签名
          path: build/SubstationApp_未签名.ipa
          retention-days: 30
